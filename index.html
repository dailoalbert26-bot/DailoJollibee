<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jollibee Store Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { jbRed: '#E31837', jbYellow: '#FFC72C', jbDarkRed: '#A61025' }
        }
      }
    }
  </script>
  <style>
    .nav-active { background-color: #FEF2F2 !important; color: #E31837 !important; font-weight: 700 !important; border-left: 4px solid #E31837; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-jbRed px-4">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 space-y-6 relative overflow-hidden">
      <div class="absolute top-0 left-0 w-full h-2 bg-jbYellow"></div>
      
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-jbYellow text-jbRed rounded-full text-3xl mb-2 font-black shadow-md">J</div>
        <h2 class="text-2xl font-bold text-gray-800">Jollibee Store Inventory</h2>
      </div>

      <div id="login-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded text-xs"></div>

      <!-- STEP 1: LOGIN FORM -->
      <form id="login-form" onsubmit="handleRequestOTP(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Username / ID</label>
          <input type="text" id="login-user" required class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-jbRed focus:outline-none text-sm" placeholder="e.g. manager">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
          <input type="password" id="login-pass" required class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-jbRed focus:outline-none text-sm" placeholder="••••••••">
        </div>
        <button type="submit" id="login-btn" class="w-full bg-jbRed text-white py-3 rounded-lg font-bold text-sm hover:bg-jbDarkRed transition shadow-lg flex justify-center items-center">
          <span>CONTINUE TO VERIFICATION</span>
        </button>
      </form>

      <!-- STEP 2: GMAIL OTP FORM -->
      <form id="otp-form" onsubmit="handleVerifyOTP(event)" class="hidden space-y-4">
        <div class="bg-blue-50 border border-blue-200 text-blue-800 p-3 rounded-lg text-xs">
          An OTP verification code was sent to your registered Gmail address: <strong id="otp-email-display"></strong>
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Enter 6-Digit OTP Code</label>
          <input type="text" id="login-otp" required maxlength="6" class="w-full text-center tracking-widest text-lg font-bold px-4 py-2 border rounded-lg focus:ring-2 focus:ring-jbRed focus:outline-none" placeholder="123456">
        </div>
        <button type="submit" id="otp-btn" class="w-full bg-jbRed text-white py-3 rounded-lg font-bold text-sm hover:bg-jbDarkRed transition shadow-lg">
          VERIFY & LOGIN
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-screen" class="hidden min-h-screen flex flex-col md:flex-row">
    <aside id="sidebar" class="hidden md:flex flex-col w-full md:w-64 bg-white border-r min-h-screen fixed md:sticky top-0 h-screen z-30">
      <div class="p-5 border-b bg-jbRed text-white flex items-center space-x-3">
        <div class="bg-jbYellow text-jbRed font-bold rounded-full w-10 h-10 flex items-center justify-center text-xl">J</div>
        <div>
          <h1 class="font-bold text-base leading-tight">Jollibee Store</h1>
          <p class="text-xs text-jbYellow font-semibold">Inventory System</p>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 text-xs font-semibold rounded-lg text-gray-600">
          <i class="fa-solid fa-chart-pie w-5"></i><span>1. Dashboard</span>
        </button>
        <button onclick="navigate('ingredients')" id="nav-ingredients" class="nav-btn w-full flex items-center space-x-3 px-3 py-2.5 text-xs font-semibold rounded-lg text-gray-600">
          <i class="fa-solid fa-drumstick-bite w-5"></i><span>2. Raw Ingredients</span>
        </button>
      </nav>
      <div class="p-3 border-t bg-gray-50 flex items-center justify-between">
        <div>
          <p id="user-display-name" class="text-xs font-bold text-gray-800">Manager</p>
          <p id="user-display-role" class="text-[10px] text-gray-500 uppercase">Admin</p>
        </div>
        <button onclick="location.reload()" class="text-gray-400 hover:text-jbRed p-1.5"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </aside>

    <main class="flex-1 p-6">
      <section id="sec-dashboard" class="space-y-6">
        <h2 class="text-xl font-extrabold text-gray-800">Store Dashboard Overview</h2>
        <div class="bg-white p-4 rounded-xl border shadow-sm">
          <h3 class="font-bold text-sm mb-3">Critical Stock Alerts</h3>
          <table class="w-full text-left text-xs">
            <thead class="bg-gray-50 uppercase font-bold border-b">
              <tr><th class="p-3">Item Description</th><th class="p-3">Category</th><th class="p-3">Stock Level</th></tr>
            </thead>
            <tbody id="tbl-critical-body" class="divide-y divide-gray-100">
              <tr><td colspan="3" class="p-4 text-center text-gray-400">Loading system data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz1zF4WHOOdk9tG8vYw8Q1qinpWzNSiqTeKk4cNsUSx9DWpzp8jniz8wR8EccdTl-qs4A/exec";
    let activeUser = "";

    async function handleRequestOTP(e) {
      e.preventDefault();
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      errBox.classList.add('hidden');
      btn.innerText = "SENDING OTP TO GMAIL...";
      btn.disabled = true;

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=requestOTP&username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}`);
        const data = await res.json();

        if (data.status === "OTP_SENT") {
          activeUser = user;
          document.getElementById('otp-email-display').innerText = data.email;
          document.getElementById('login-form').classList.add('hidden');
          document.getElementById('otp-form').classList.remove('hidden');
        } else {
          errBox.innerText = data.message;
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = "Error requesting security OTP.";
        errBox.classList.remove('hidden');
      } finally {
        btn.innerText = "CONTINUE TO VERIFICATION";
        btn.disabled = false;
      }
    }

    async function handleVerifyOTP(e) {
      e.preventDefault();
      const otp = document.getElementById('login-otp').value.trim();
      const errBox = document.getElementById('login-error');
      const btn = document.getElementById('otp-btn');

      errBox.classList.add('hidden');
      btn.innerText = "VERIFYING...";
      btn.disabled = true;

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?action=verifyOTP&username=${encodeURIComponent(activeUser)}&otp=${encodeURIComponent(otp)}`);
        const data = await res.json();

        if (data.status === "SUCCESS") {
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('app-screen').classList.remove('hidden');
          document.getElementById('user-display-name').innerText = data.user.username.toUpperCase();
          document.getElementById('user-display-role').innerText = data.user.role;
        } else {
          errBox.innerText = data.message;
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        errBox.innerText = "OTP verification failed.";
        errBox.classList.remove('hidden');
      } finally {
        btn.innerText = "VERIFY & LOGIN";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
